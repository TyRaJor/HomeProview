<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>陈氏宗脉图 · Chen Family Lineage</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="loader" id="loader">
    <div>
      <div class="ring"></div>
      <div class="txt">脉络生成中…</div>
    </div>
  </div>

  <div class="topbar">
    <div class="brand">
      <div class="seal">陈</div>
      <div>
        <h1>陈氏宗脉图</h1>
        <div class="sub">CHEN FAMILY LINEAGE</div>
      </div>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input id="search" type="text" placeholder="搜索族人姓名…" autocomplete="off" />
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div id="stage"></div>

  <!-- 小地图 -->
  <div class="minimap" id="minimap">
    <div class="minimap-label">全景导航</div>
    <canvas id="minimapCanvas"></canvas>
    <div class="minimap-viewport" id="minimapViewport"></div>
  </div>

  <div class="legend">
    <h4>世系图例</h4>
    <div class="row"><span class="swatch"
        style="background:linear-gradient(135deg,var(--ancestor-color),var(--ancestor-color-2))"></span>始祖 / 先祖</div>
    <div class="row"><span class="swatch"
        style="background:linear-gradient(135deg,var(--male-color),var(--male-color-2))"></span>男性</div>
    <div class="row"><span class="swatch"
        style="background:linear-gradient(135deg,var(--female-color),var(--female-color-2))"></span>女性</div>
    <div class="row"><span class="swatch"
        style="background:linear-gradient(135deg,var(--spouse-color),var(--spouse-color-2))"></span>配偶</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="zoomIn" title="放大">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>
    <button class="ctrl-btn" id="zoomOut" title="缩小">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14" />
      </svg>
    </button>
    <button class="ctrl-btn" id="reset" title="重置视图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9" />
        <path d="M3 3v6h6" />
      </svg>
    </button>
    <button class="ctrl-btn" id="fit" title="适应屏幕">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
      </svg>
    </button>
    <button class="ctrl-btn" id="settingsBtn" title="颜色设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
    <div class="zoom-indicator" id="zoomIndicator">100%</div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <button class="close" id="closeDetail">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
    <div class="avatar" id="dpAvatar">陈</div>
    <div class="name" id="dpName">—</div>
    <div class="title" id="dpTitle">—</div>
    <div class="field"><span class="k">UUID</span><span class="v" id="dpUuid">—</span></div>
    <div class="field"><span class="k">性别</span><span class="v" id="dpGender">—</span></div>
    <div class="field"><span class="k">世代</span><span class="v" id="dpGen">—</span></div>
    <div class="field"><span class="k">分支</span><span class="v" id="dpBranch">—</span></div>
    <div class="field"><span class="k">父系</span><span class="v" id="dpParent">—</span></div>
    <div class="field"><span class="k">配偶</span><span class="v" id="dpSpouse">—</span></div>
    <div class="field"><span class="k">子嗣</span><span class="v" id="dpChildren">—</span></div>
    <button class="uuid-btn" id="copyUuid">复制 UUID</button>
  </div>

  <!-- 颜色设置面板 -->
  <div class="settings-panel" id="settingsPanel">
    <button class="close" id="closeSettings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
    <h3>颜色设置</h3>
    <div class="settings-group">
      <label>男性颜色</label>
      <div class="color-row">
        <input type="color" id="maleColor" value="#5eead4">
        <input type="color" id="maleColor2" value="#3b82f6">
      </div>
    </div>
    <div class="settings-group">
      <label>女性颜色</label>
      <div class="color-row">
        <input type="color" id="femaleColor" value="#fb7185">
        <input type="color" id="femaleColor2" value="#f472b6">
      </div>
    </div>
    <div class="settings-group">
      <label>先祖颜色</label>
      <div class="color-row">
        <input type="color" id="ancestorColor" value="#f6d365">
        <input type="color" id="ancestorColor2" value="#fda085">
      </div>
    </div>
    <div class="settings-group">
      <label>配偶颜色</label>
      <div class="color-row">
        <input type="color" id="spouseColor" value="#a78bfa">
        <input type="color" id="spouseColor2" value="#8b5cf6">
      </div>
    </div>
    <button class="uuid-btn" id="resetColors">恢复默认</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js" defer></script>
</body>

</html>
