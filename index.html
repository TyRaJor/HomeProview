<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>陈氏宗脉图 · Chen Family Lineage</title>
<style>
  :root {
    --bg-0: #0a0e1a;
    --bg-1: #111827;
    --bg-2: #1a2236;
    --gold-1: #f6d365;
    --gold-2: #fda085;
    --gold-3: #c9a227;
    --jade: #5eead4;
    --rose: #fb7185;
    --ink: #e8eef7;
    --ink-dim: #8b97ad;
    --line: rgba(246, 211, 101, 0.35);
    --glass: rgba(17, 24, 39, 0.65);
    --glass-border: rgba(246, 211, 101, 0.18);
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    /* 性别颜色（可通过设置面板修改） */
    --male-color: #5eead4;
    --male-color-2: #3b82f6;
    --female-color: #fb7185;
    --female-color-2: #f472b6;
    --spouse-color: #a78bfa;
    --spouse-color-2: #8b5cf6;
    --ancestor-color: #f6d365;
    --ancestor-color-2: #fda085;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg-0);
  }

  body {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(246, 211, 101, 0.08), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(94, 234, 212, 0.06), transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(253, 160, 133, 0.04), transparent 60%),
      linear-gradient(160deg, #0a0e1a 0%, #111827 100%);
  }

  /* ===== Top bar ===== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 22px;
    background: linear-gradient(180deg, rgba(10,14,26,0.85), rgba(10,14,26,0));
    backdrop-filter: blur(12px);
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand .seal {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    display: grid; place-items: center;
    color: #3a1d00;
    font-weight: 900;
    font-size: 20px;
    box-shadow: 0 6px 20px rgba(246, 211, 101, 0.35);
    animation: sealGlow 4s ease-in-out infinite;
  }
  @keyframes sealGlow {
    0%, 100% { box-shadow: 0 6px 20px rgba(246, 211, 101, 0.35); }
    50% { box-shadow: 0 6px 28px rgba(253, 160, 133, 0.55); }
  }
  .brand h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--gold-1), var(--jade));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand .sub {
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 1px;
  }

  .search-wrap {
    margin-left: auto;
    position: relative;
    width: 280px;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    color: var(--ink);
    font-size: 14px;
    outline: none;
    transition: all 0.3s;
  }
  .search-wrap input::placeholder { color: var(--ink-dim); }
  .search-wrap input:focus {
    border-color: var(--gold-1);
    box-shadow: 0 0 0 4px rgba(246, 211, 101, 0.12);
  }
  .search-wrap svg {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    color: var(--ink-dim);
  }
  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    z-index: 50;
  }
  .search-results.show { display: block; animation: fadeDown 0.25s ease; }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .search-results .item {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .search-results .item:hover { background: rgba(246, 211, 101, 0.1); }
  .search-results .item .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold-1);
  }
  .search-results .item .name { font-size: 14px; }
  .search-results .item .meta { font-size: 11px; color: var(--ink-dim); margin-left: auto; }

  /* ===== Canvas stage ===== */
  #stage {
    position: fixed;
    inset: 0;
    cursor: grab;
    overflow: hidden;
  }
  #stage.grabbing { cursor: grabbing; }
  #stage svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ===== Controls ===== */
  .controls {
    position: fixed;
    right: 20px;
    bottom: 24px;
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ctrl-btn {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    color: var(--ink);
    cursor: pointer;
    display: grid; place-items: center;
    transition: all 0.25s;
  }
  .ctrl-btn:hover {
    border-color: var(--gold-1);
    background: rgba(246, 211, 101, 0.12);
    transform: translateY(-2px);
  }
  .ctrl-btn svg { width: 20px; height: 20px; }
  .zoom-indicator {
    text-align: center;
    font-size: 11px;
    color: var(--ink-dim);
    padding: 4px 0;
    font-variant-numeric: tabular-nums;
  }

  /* Legend */
  .legend {
    position: fixed;
    left: 20px;
    bottom: 24px;
    z-index: 30;
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 12px;
  }
  .legend h4 {
    font-size: 12px;
    color: var(--gold-1);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .legend .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
    color: var(--ink-dim);
  }
  .legend .swatch {
    width: 14px; height: 14px;
    border-radius: 4px;
  }

  /* ===== Minimap ===== */
  .minimap {
    position: fixed;
    right: 20px;
    bottom: 24px;
    z-index: 30;
    width: 220px;
    height: 160px;
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    overflow: hidden;
    cursor: crosshair;
  }
  .minimap-label {
    position: absolute;
    top: 6px; left: 10px;
    font-size: 10px;
    color: var(--gold-1);
    letter-spacing: 1px;
    z-index: 2;
    pointer-events: none;
  }
  #minimapCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .minimap-viewport {
    position: absolute;
    border: 2px solid var(--gold-1);
    background: rgba(246, 211, 101, 0.12);
    border-radius: 3px;
    pointer-events: none;
    box-shadow: 0 0 12px rgba(246, 211, 101, 0.4);
  }

  /* ===== Detail panel ===== */
  .detail-panel {
    position: fixed;
    top: 50%;
    right: -380px;
    transform: translateY(-50%);
    width: 340px;
    z-index: 40;
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: var(--shadow);
    transition: right 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .detail-panel.show { right: 24px; }
  .detail-panel .close {
    position: absolute;
    top: 14px; right: 14px;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    border: none;
    color: var(--ink-dim);
    cursor: pointer;
    display: grid; place-items: center;
    transition: all 0.2s;
  }
  .detail-panel .close:hover { background: rgba(251, 113, 133, 0.2); color: var(--rose); }
  .detail-panel .avatar {
    width: 64px; height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
    display: grid; place-items: center;
    font-size: 26px;
    font-weight: 800;
    color: #3a1d00;
    margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(246, 211, 101, 0.3);
  }
  .detail-panel .name {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .detail-panel .title {
    font-size: 12px;
    color: var(--gold-1);
    letter-spacing: 2px;
    margin-bottom: 18px;
  }
  .detail-panel .field {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 13px;
  }
  .detail-panel .field .k { color: var(--ink-dim); }
  .detail-panel .field .v { color: var(--ink); font-family: "SF Mono", Consolas, monospace; font-size: 12px; word-break: break-all; text-align: right; max-width: 60%; }
  .detail-panel .uuid-btn {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, rgba(246,211,101,0.15), rgba(94,234,212,0.1));
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    color: var(--ink);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.25s;
  }
  .detail-panel .uuid-btn:hover {
    border-color: var(--gold-1);
    background: linear-gradient(135deg, rgba(246,211,101,0.25), rgba(94,234,212,0.18));
  }

  /* ===== Settings panel ===== */
  .settings-panel {
    position: fixed;
    top: 50%;
    left: -340px;
    transform: translateY(-50%);
    width: 300px;
    z-index: 40;
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: var(--shadow);
    transition: left 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .settings-panel.show { left: 24px; }
  .settings-panel .close {
    position: absolute;
    top: 14px; right: 14px;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    border: none;
    color: var(--ink-dim);
    cursor: pointer;
    display: grid; place-items: center;
    transition: all 0.2s;
  }
  .settings-panel .close:hover { background: rgba(251, 113, 133, 0.2); color: var(--rose); }
  .settings-panel h3 {
    font-size: 18px;
    margin-bottom: 18px;
    color: var(--gold-1);
  }
  .settings-group {
    margin-bottom: 18px;
  }
  .settings-group label {
    display: block;
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }
  .color-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .color-row input[type="color"] {
    width: 48px;
    height: 36px;
    border: 2px solid var(--glass-border);
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
    padding: 2px;
  }
  .color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-row input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
  .settings-panel .uuid-btn {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, rgba(246,211,101,0.15), rgba(94,234,212,0.1));
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    color: var(--ink);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.25s;
  }
  .settings-panel .uuid-btn:hover {
    border-color: var(--gold-1);
    background: linear-gradient(135deg, rgba(246,211,101,0.25), rgba(94,234,212,0.18));
  }

  /* ===== Node styles ===== */
  .node-group { cursor: pointer; }
  .node-bg {
    transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .node-group:hover .node-bg {
    filter: url(#glow);
  }
  .node-label {
    fill: var(--ink);
    font-size: 14px;
    font-weight: 600;
    text-anchor: middle;
    pointer-events: none;
  }
  .node-sub {
    fill: var(--ink-dim);
    font-size: 10px;
    text-anchor: middle;
    pointer-events: none;
  }
  @media (max-width: 768px) {
    .node-label { font-size: 11px; }
    .node-sub { font-size: 8px; }
    .topbar { padding: 10px 14px; gap: 10px; }
    .brand .seal { width: 34px; height: 34px; font-size: 16px; }
    .brand h1 { font-size: 15px; letter-spacing: 1px; }
    .brand .sub { display: none; }
    .search-wrap { width: 160px; }
    .search-wrap input { font-size: 12px; padding: 8px 12px 8px 34px; }
    .search-wrap svg { left: 10px; width: 14px; height: 14px; }
    .search-results { max-height: 50vh; }
    .controls { right: 10px; bottom: 12px; gap: 6px; }
    .ctrl-btn { width: 38px; height: 38px; border-radius: 10px; }
    .ctrl-btn svg { width: 18px; height: 18px; }
    .legend { left: 10px; bottom: 12px; padding: 10px 12px; font-size: 11px; }
    .legend h4 { font-size: 11px; margin-bottom: 6px; }
    .legend .row { margin: 4px 0; gap: 6px; }
    .legend .swatch { width: 12px; height: 12px; }
    .minimap { right: 10px; bottom: 80px; width: 110px; height: 78px; }
    .detail-panel {
      top: auto; bottom: 0; left: 0; right: 0;
      width: 100% !important; max-height: 60vh;
      transform: translateY(100%);
      border-radius: 18px 18px 0 0;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .detail-panel.show { right: 0 !important; transform: translateY(0); }
    .detail-panel .avatar { width: 52px; height: 52px; font-size: 22px; margin-bottom: 10px; }
    .detail-panel .name { font-size: 20px; }
    .detail-panel .title { margin-bottom: 12px; }
    .settings-panel {
      left: 0 !important; right: 0; top: 0;
      width: 100% !important; height: 100vh;
      border-radius: 0;
    }
    .settings-panel.show { left: 0 !important; }
    .settings-group .color-row { gap: 8px; }
    .settings-group .color-row input { width: 44px; height: 44px; }
  }

  .edge {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 99999;
    stroke-dashoffset: 99999;
    animation: drawLine 1.2s ease forwards;
  }
  .edge.marriage {
    stroke: var(--spouse-color);
    stroke-width: 2;
    stroke-dasharray: none;
    stroke-dashoffset: 0;
    opacity: 0.7;
    animation: none;
  }
  .edge.highlight {
    stroke: var(--gold-1);
    stroke-width: 2.5;
  }
  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  .node-group {
    opacity: 0;
    animation: nodeIn 0.6s ease forwards;
  }
  @keyframes nodeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* loading */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    background: var(--bg-0);
    transition: opacity 0.6s;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }
  .loader .ring {
    width: 60px; height: 60px;
    border: 3px solid rgba(246, 211, 101, 0.15);
    border-top-color: var(--gold-1);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader .txt {
    margin-top: 16px;
    color: var(--ink-dim);
    font-size: 13px;
    letter-spacing: 3px;
  }

  .stats {
    position: fixed;
    left: 20px;
    top: 72px;
    z-index: 30;
    background: var(--glass);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--ink-dim);
  }
  .stats b { color: var(--gold-1); font-weight: 700; }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--glass);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--ink);
    opacity: 0;
    transition: all 0.3s;
    z-index: 60;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div>
    <div class="ring"></div>
    <div class="txt">脉络生成中…</div>
  </div>
</div>

<div class="topbar">
  <div class="brand">
    <div class="seal">陈</div>
    <div>
      <h1>陈氏宗脉图</h1>
      <div class="sub">CHEN FAMILY LINEAGE</div>
    </div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="搜索族人姓名…" autocomplete="off" />
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="stats" id="stats"></div>

<div id="stage"></div>

<!-- 小地图 -->
<div class="minimap" id="minimap">
  <div class="minimap-label">全景导航</div>
  <canvas id="minimapCanvas"></canvas>
  <div class="minimap-viewport" id="minimapViewport"></div>
</div>

<div class="legend">
  <h4>世系图例</h4>
  <div class="row"><span class="swatch" style="background:linear-gradient(135deg,var(--ancestor-color),var(--ancestor-color-2))"></span>始祖 / 先祖</div>
  <div class="row"><span class="swatch" style="background:linear-gradient(135deg,var(--male-color),var(--male-color-2))"></span>男性</div>
  <div class="row"><span class="swatch" style="background:linear-gradient(135deg,var(--female-color),var(--female-color-2))"></span>女性</div>
  <div class="row"><span class="swatch" style="background:linear-gradient(135deg,var(--spouse-color),var(--spouse-color-2))"></span>配偶</div>
</div>

<div class="controls">
  <button class="ctrl-btn" id="zoomIn" title="放大">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="ctrl-btn" id="zoomOut" title="缩小">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
  </button>
  <button class="ctrl-btn" id="reset" title="重置视图">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/></svg>
  </button>
  <button class="ctrl-btn" id="fit" title="适应屏幕">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button class="ctrl-btn" id="settingsBtn" title="颜色设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
  <div class="zoom-indicator" id="zoomIndicator">100%</div>
</div>

function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

/* ============================================================
 *  树形布局算法
 * ============================================================ */
/* 节点尺寸与间距：根据屏幕宽度自适应 */
const isMobile = window.innerWidth < 768;
const NODE_W = isMobile ? 84 : 104;
const NODE_H = isMobile ? 42 : 48;
const H_GAP = isMobile ? 14 : 20;      // 同辈节点间距（防止遮挡）
const V_GAP = isMobile ? 40 : 54;      // 世代间距
const SPOUSE_GAP = isMobile ? 12 : 18; // 夫妻间距
const BUS_OFFSET = isMobile ? 16 : 22; // 横向总线距父节点底部的距离

const nodeMap = new Map();   // id -> node data
let allNodes = [];

function buildTree(root) {
  let idCounter = 0;
  function walk(node, parent, generation, branch) {
    const id = 'n' + (idCounter++);
    const n = {
      id,
      name: node.name,
      title: node.title || '',
      type: node.type || 'child',
      gender: node.gender || (node.type === 'spouse' ? 'female' : 'male'),
      parent: parent ? parent.id : null,
      generation,
      branch,
      uuid: uuid(),
      x: 0, y: 0,
      width: NODE_W,
      height: NODE_H,
      children: []
    };
    nodeMap.set(id, n);
    allNodes.push(n);
    if (node.children) {
      const childBranch = (node.type === 'ancestor' || generation <= 5) ? branch : (branch + '-' + id);
      n.children = node.children.map(c => walk(c, n, generation + 1, childBranch));
    }
    return n;
  }
  return walk(root, null, 1, 'main');
}

/* 获取节点的配偶（第一个 type=spouse 的子节点） */
function getSpouse(node) {
  return node.children.find(c => c.type === 'spouse') || null;
}

/* 获取节点的子女（排除配偶） */
function getChildren(node) {
  return node.children.filter(c => c.type !== 'spouse');
}

/* 计算子树宽度 */
function subtreeWidth(node) {
  const spouse = getSpouse(node);
  const kids = getChildren(node);
  const coupleW = spouse ? node.width + SPOUSE_GAP + spouse.width : node.width;

  if (kids.length === 0) return coupleW;

  let total = 0;
  kids.forEach((c, i) => {
    total += subtreeWidth(c);
    if (i < kids.length - 1) total += H_GAP;
  });
  return Math.max(total, coupleW);
}

/* 布局：自上而下，配偶并排，子女下方居中 */
function layout(node, x, y) {
  node.y = y;
  const spouse = getSpouse(node);
  const kids = getChildren(node);
  const coupleW = spouse ? node.width + SPOUSE_GAP + spouse.width : node.width;

  if (kids.length === 0) {
    // 无子女：节点与配偶并排居中放置
    node.x = x + (coupleW - node.width) / 2 + node.width / 2;
    if (spouse) {
      spouse.y = y;
      spouse.x = node.x + node.width / 2 + SPOUSE_GAP + spouse.width / 2;
    }
    return;
  }

  // 计算子女总宽度
  let totalW = 0;
  const childWidths = kids.map(c => subtreeWidth(c));
  childWidths.forEach((w, i) => {
    totalW += w;
    if (i < childWidths.length - 1) totalW += H_GAP;
  });

  // 夫妻整体居中于子女上方
  const coupleLeft = x + (totalW - coupleW) / 2;
  node.x = coupleLeft + node.width / 2;
  if (spouse) {
    spouse.y = y;
    spouse.x = node.x + node.width / 2 + SPOUSE_GAP + spouse.width / 2;
  }

  // 子女从 x 开始排列
  let cx = x;
  kids.forEach((c, i) => {
    const cw = childWidths[i];
    layout(c, cx, y + V_GAP + NODE_H);
    cx += cw + H_GAP;
  });
}

let svg, rootG, defs;
let viewState = { scale: 1, tx: 0, ty: 0 };
let bounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };

const typeColors = {
  ancestor: { fill: 'url(#gradAncestor)', stroke: 'var(--ancestor-color)', glow: 'var(--ancestor-color)' },
  male:     { fill: 'url(#gradMale)',     stroke: 'var(--male-color)',     glow: 'var(--male-color)' },
  female:   { fill: 'url(#gradFemale)',   stroke: 'var(--female-color)',   glow: 'var(--female-color)' },
  spouse:   { fill: 'url(#gradSpouse)',   stroke: 'var(--spouse-color)',   glow: 'var(--spouse-color)' },
  child:    { fill: 'url(#gradChild)',    stroke: 'var(--male-color)',     glow: 'var(--male-color)' }
};

/* 根据节点类型+性别获取颜色 */
function getNodeColors(node) {
  if (node.type === 'ancestor') return typeColors.ancestor;
  if (node.type === 'spouse') return typeColors.spouse;
  if (node.gender === 'female') return typeColors.female;
  if (node.gender === 'male') return typeColors.male;
  return typeColors.child;
}

function createSvg() {
  svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('id', 'treeSvg');
  defs = document.createElementNS(svgNS, 'defs');
  defs.innerHTML = `
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="gradAncestor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--ancestor-color)"/><stop offset="100%" stop-color="var(--ancestor-color-2)"/>
    </linearGradient>
    <linearGradient id="gradMale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--male-color)"/><stop offset="100%" stop-color="var(--male-color-2)"/>
    </linearGradient>
    <linearGradient id="gradFemale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--female-color)"/><stop offset="100%" stop-color="var(--female-color-2)"/>
    </linearGradient>
    <linearGradient id="gradSpouse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--spouse-color)"/><stop offset="100%" stop-color="var(--spouse-color-2)"/>
    </linearGradient>
    <linearGradient id="gradChild" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--male-color)"/><stop offset="100%" stop-color="var(--male-color-2)"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(246,211,101,0.4)"/>
    </marker>
  `;
  svg.appendChild(defs);
  rootG = document.createElementNS(svgNS, 'g');
  rootG.setAttribute('id', 'rootG');
  svg.appendChild(rootG);
  stage.appendChild(svg);
}

function renderEdges(root) {
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class', 'edges');

  function draw(node) {
    const spouse = getSpouse(node);
    const kids = getChildren(node);

    // 1) 婚姻线：节点右侧 → 配偶左侧（水平直线）
    if (spouse) {
      const x1 = node.x + node.width / 2;
      const x2 = spouse.x - spouse.width / 2;
      const y = node.y;
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('class', 'edge marriage');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y);
      line.setAttribute('data-from', node.id);
      line.setAttribute('data-to', spouse.id);
      g.appendChild(line);
    }

    // 2) 子女 T 形连线
    if (kids.length > 0) {
      // 主干起点：夫妻中心（或节点中心）底部
      const trunkX = spouse ? (node.x + spouse.x) / 2 : node.x;
      const trunkTop = node.y + node.height / 2;
      const busY = node.y + node.height / 2 + BUS_OFFSET;

      // 主干竖线
      const trunk = document.createElementNS(svgNS, 'line');
      trunk.setAttribute('class', 'edge');
      trunk.setAttribute('x1', trunkX);
      trunk.setAttribute('y1', trunkTop);
      trunk.setAttribute('x2', trunkX);
      trunk.setAttribute('y2', busY);
      trunk.setAttribute('data-from', node.id);
      trunk.setAttribute('data-to', kids[0].id);
      g.appendChild(trunk);

      // 横向总线（连接所有子女的顶部）
      if (kids.length > 1) {
        const busLeft = kids[0].x;
        const busRight = kids[kids.length - 1].x;
        const bus = document.createElementNS(svgNS, 'line');
        bus.setAttribute('class', 'edge');
        bus.setAttribute('x1', busLeft);
        bus.setAttribute('y1', busY);
        bus.setAttribute('x2', busRight);
        bus.setAttribute('y2', busY);
        bus.setAttribute('data-from', node.id);
        bus.setAttribute('data-to', kids[kids.length - 1].id);
        g.appendChild(bus);
      }

      // 每个子女的竖线
      kids.forEach(c => {
        const drop = document.createElementNS(svgNS, 'line');
        drop.setAttribute('class', 'edge');
        drop.setAttribute('x1', c.x);
        drop.setAttribute('y1', busY);
        drop.setAttribute('x2', c.x);
        drop.setAttribute('y2', c.y - c.height / 2);
        drop.setAttribute('data-from', node.id);
        drop.setAttribute('data-to', c.id);
        g.appendChild(drop);
      });
    }

    // 递归绘制子女
    kids.forEach(draw);
  }
  draw(root);
  rootG.appendChild(g);
}

function renderNodes(root) {
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class', 'nodes');
  let delay = 0;
  function draw(node) {
    const colors = getNodeColors(node);
    const group = document.createElementNS(svgNS, 'g');
    group.setAttribute('class', 'node-group');
    group.setAttribute('data-id', node.id);
    group.setAttribute('transform', `translate(${node.x}, ${node.y})`);
    group.style.animationDelay = (delay * 0.03) + 's';
    delay++;

    // 阴影
    const shadow = document.createElementNS(svgNS, 'rect');
    shadow.setAttribute('class', 'node-shadow');
    shadow.setAttribute('x', -node.width / 2 + 3);
    shadow.setAttribute('y', -node.height / 2 + 5);
    shadow.setAttribute('width', node.width);
    shadow.setAttribute('height', node.height);
    shadow.setAttribute('rx', 14);
    shadow.setAttribute('fill', 'rgba(0,0,0,0.4)');
    shadow.setAttribute('filter', 'blur(6px)');
    group.appendChild(shadow);

    // 背景
    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('class', 'node-bg');
    rect.setAttribute('x', -node.width / 2);
    rect.setAttribute('y', -node.height / 2);
    rect.setAttribute('width', node.width);
    rect.setAttribute('height', node.height);
    rect.setAttribute('rx', 14);
    rect.setAttribute('fill', colors.fill);
    rect.setAttribute('stroke', colors.stroke);
    rect.setAttribute('stroke-width', 1.5);
    group.appendChild(rect);

    // 姓名
    const name = document.createElementNS(svgNS, 'text');
    name.setAttribute('class', 'node-label');
    name.setAttribute('y', node.type === 'ancestor' ? 4 : 2);
    name.textContent = node.name;
    group.appendChild(name);

    // 标题/世代
    if (node.title) {
      const sub = document.createElementNS(svgNS, 'text');
      sub.setAttribute('class', 'node-sub');
      sub.setAttribute('y', 22);
      sub.textContent = node.title;
      group.appendChild(sub);
    } else {
      const sub = document.createElementNS(svgNS, 'text');
      sub.setAttribute('class', 'node-sub');
      sub.setAttribute('y', 22);
      sub.textContent = '第 ' + node.generation + ' 世';
      group.appendChild(sub);
    }

    // 类型圆点
    const dot = document.createElementNS(svgNS, 'circle');
    dot.setAttribute('cx', node.width / 2 - 12);
    dot.setAttribute('cy', -node.height / 2 + 12);
    dot.setAttribute('r', 4);
    dot.setAttribute('fill', colors.stroke);
    group.appendChild(dot);

    group.addEventListener('click', (e) => {
      e.stopPropagation();
      selectNode(node.id);
    });
    group.addEventListener('mouseenter', () => highlightPath(node.id));
    group.addEventListener('mouseleave', () => clearHighlight());

    g.appendChild(group);
    node.children.forEach(draw);
  }
  draw(root);
  rootG.appendChild(g);
}

/* 渲染世代坐标轴标签（左侧） */
function renderGenLabels(root) {
  const genY = new Map();
  function walk(n) {
    if (!genY.has(n.generation)) genY.set(n.generation, n.y);
    n.children.forEach(walk);
  }
  walk(root);

  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class', 'gen-labels');
  const x = bounds.minX - 60;

  genY.forEach((y, gen) => {
    const bg = document.createElementNS(svgNS, 'rect');
    bg.setAttribute('x', x - 34);
    bg.setAttribute('y', y - 14);
    bg.setAttribute('width', 68);
    bg.setAttribute('height', 28);
    bg.setAttribute('rx', 14);
    bg.setAttribute('fill', 'rgba(246, 211, 101, 0.08)');
    bg.setAttribute('stroke', 'rgba(246, 211, 101, 0.25)');
    g.appendChild(bg);

    const txt = document.createElementNS(svgNS, 'text');
    txt.setAttribute('x', x);
    txt.setAttribute('y', y + 5);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('fill', '#f6d365');
    txt.setAttribute('font-size', '13');
    txt.setAttribute('font-weight', '600');
    txt.textContent = '第' + gen + '世';
    g.appendChild(txt);

    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', x + 36);
    line.setAttribute('y1', y);
    line.setAttribute('x2', bounds.minX - 4);
    line.setAttribute('y2', y);
    line.setAttribute('stroke', 'rgba(246, 211, 101, 0.12)');
    line.setAttribute('stroke-dasharray', '4 6');
    g.appendChild(line);
  });

  rootG.appendChild(g);
}

function updateBounds(root) {
  bounds = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
  function walk(n) {
    bounds.minX = Math.min(bounds.minX, n.x - n.width / 2);
    bounds.maxX = Math.max(bounds.maxX, n.x + n.width / 2);
    bounds.minY = Math.min(bounds.minY, n.y - n.height / 2);
    bounds.maxY = Math.max(bounds.maxY, n.y + n.height / 2);
    n.children.forEach(walk);
  }
  walk(root);
}

/* ============================================================
 *  视图变换：缩放 / 平移
 * ============================================================ */
function applyTransform() {
  rootG.setAttribute('transform', `translate(${viewState.tx}, ${viewState.ty}) scale(${viewState.scale})`);
  document.getElementById('zoomIndicator').textContent = Math.round(viewState.scale * 100) + '%';
  updateMinimapViewport();
}

/* ===== 小地图 ===== */
let minimapCtx, minimapRect;
function initMinimap() {
  const canvas = document.getElementById('minimapCanvas');
  minimapCtx = canvas.getContext('2d');
  minimapRect = { w: 220, h: 160 };
  canvas.width = minimapRect.w;
  canvas.height = minimapRect.h;
  drawMinimap();

  const minimap = document.getElementById('minimap');
  minimap.addEventListener('click', (e) => {
    const r = minimap.getBoundingClientRect();
    const mx = (e.clientX - r.left) / r.width;
    const my = (e.clientY - r.top) / r.height;
    const treeW = bounds.maxX - bounds.minX;
    const treeH = bounds.maxY - bounds.minY;
    const wx = bounds.minX + mx * treeW;
    const wy = bounds.minY + my * treeH;
    viewState.tx = window.innerWidth / 2 - wx * viewState.scale;
    viewState.ty = window.innerHeight / 2 - wy * viewState.scale;
    applyTransform();
  });
}

function drawMinimap() {
  if (!minimapCtx) return;
  const { w, h } = minimapRect;
  minimapCtx.clearRect(0, 0, w, h);
  const treeW = bounds.maxX - bounds.minX;
  const treeH = bounds.maxY - bounds.minY;
  if (treeW === 0 || treeH === 0) return;
  const scale = Math.min(w / treeW, h / treeH) * 0.92;
  const offX = (w - treeW * scale) / 2 - bounds.minX * scale;
  const offY = (h - treeH * scale) / 2 - bounds.minY * scale;

  // 画连线
  minimapCtx.strokeStyle = 'rgba(246,211,101,0.25)';
  minimapCtx.lineWidth = 0.5;
  function drawEdges(n) {
    n.children.forEach(c => {
      minimapCtx.beginPath();
      minimapCtx.moveTo(n.x * scale + offX, n.y * scale + offY);
      const my = n.y * scale + offY + (c.y - n.y) * scale * 0.5;
      minimapCtx.bezierCurveTo(
        n.x * scale + offX, my,
        c.x * scale + offX, my,
        c.x * scale + offX, c.y * scale + offY
      );
      minimapCtx.stroke();
      drawEdges(c);
    });
  }
  drawEdges(nodeMap.get('n0'));

  // 画节点
  const cs = getComputedStyle(document.documentElement);
  allNodes.forEach(n => {
    let color;
    if (n.type === 'ancestor') color = cs.getPropertyValue('--ancestor-color').trim() || '#f6d365';
    else if (n.type === 'spouse') color = cs.getPropertyValue('--spouse-color').trim() || '#a78bfa';
    else if (n.gender === 'female') color = cs.getPropertyValue('--female-color').trim() || '#fb7185';
    else color = cs.getPropertyValue('--male-color').trim() || '#5eead4';
    minimapCtx.fillStyle = color;
    minimapCtx.beginPath();
    minimapCtx.arc(n.x * scale + offX, n.y * scale + offY, n.type === 'ancestor' ? 2.2 : 1.4, 0, Math.PI * 2);
    minimapCtx.fill();
  });

  // 存缩放参数供 viewport 使用
  minimapRect.scale = scale;
  minimapRect.offX = offX;
  minimapRect.offY = offY;
}

function updateMinimapViewport() {
  const vp = document.getElementById('minimapViewport');
  if (!minimapRect || minimapRect.scale == null) return;
  const { scale, offX, offY, w, h } = minimapRect;
  // 屏幕可见区域在 SVG 坐标中的范围
  const viewLeft = (0 - viewState.tx) / viewState.scale;
  const viewTop = (0 - viewState.ty) / viewState.scale;
  const viewRight = (window.innerWidth - viewState.tx) / viewState.scale;
  const viewBottom = (window.innerHeight - viewState.ty) / viewState.scale;
  // 转换到 minimap 像素
  const mx = viewLeft * scale + offX;
  const my = viewTop * scale + offY;
  const mw = (viewRight - viewLeft) * scale;
  const mh = (viewBottom - viewTop) * scale;
  vp.style.left = mx + 'px';
  vp.style.top = my + 'px';
  vp.style.width = Math.min(mw, w) + 'px';
  vp.style.height = Math.min(mh, h) + 'px';
}

function fitView() {
  const w = bounds.maxX - bounds.minX;
  const h = bounds.maxY - bounds.minY;
  const padding = isMobile ? 30 : 80;
  const sx = (window.innerWidth - padding * 2) / w;
  const sy = (window.innerHeight - padding * 2) / h;
  viewState.scale = Math.min(sx, sy, isMobile ? 1.0 : 1.2);
  viewState.tx = window.innerWidth / 2 - (bounds.minX + w / 2) * viewState.scale;
  viewState.ty = window.innerHeight / 2 - (bounds.minY + h / 2) * viewState.scale;
  applyTransform();
}

function focusOnRoot(root) {
  const targetScale = 1.0;
  viewState.scale = targetScale;
  viewState.tx = window.innerWidth / 2 - root.x * targetScale;
  viewState.ty = 80 - root.y * targetScale;
  applyTransform();
}

function resetView() {
  const root = nodeMap.get('n0');
  if (root) focusOnRoot(root);
  else { viewState = { scale: 1, tx: 0, ty: 0 }; applyTransform(); }
}

function zoomAt(factor, cx, cy) {
  const oldScale = viewState.scale;
  const newScale = Math.max(0.2, Math.min(3, oldScale * factor));
  const realFactor = newScale / oldScale;
  viewState.tx = cx - (cx - viewState.tx) * realFactor;
  viewState.ty = cy - (cy - viewState.ty) * realFactor;
  viewState.scale = newScale;
  applyTransform();
}

/* 拖拽平移 */
let isDragging = false, dragStart = { x: 0, y: 0 }, viewStart = { tx: 0, ty: 0 };

stage.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node-group')) return;
  isDragging = true;
  stage.classList.add('grabbing');
  dragStart = { x: e.clientX, y: e.clientY };
  viewStart = { tx: viewState.tx, ty: viewState.ty };
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  viewState.tx = viewStart.tx + (e.clientX - dragStart.x);
  viewState.ty = viewStart.ty + (e.clientY - dragStart.y);
  applyTransform();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  stage.classList.remove('grabbing');
});

stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  zoomAt(factor, e.clientX, e.clientY);
}, { passive: false });

document.getElementById('zoomIn').onclick = () => zoomAt(1.2, window.innerWidth / 2, window.innerHeight / 2);
document.getElementById('zoomOut').onclick = () => zoomAt(1 / 1.2, window.innerWidth / 2, window.innerHeight / 2);
document.getElementById('reset').onclick = resetView;
document.getElementById('fit').onclick = fitView;

/* 触摸支持 */
let touchDist = 0;
stage.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    viewStart = { tx: viewState.tx, ty: viewState.ty };
  } else if (e.touches.length === 2) {
    touchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
}, { passive: true });

stage.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1 && isDragging) {
    viewState.tx = viewStart.tx + (e.touches[0].clientX - dragStart.x);
    viewState.ty = viewStart.ty + (e.touches[0].clientY - dragStart.y);
    applyTransform();
  } else if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const factor = d / touchDist;
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    zoomAt(factor, cx, cy);
    touchDist = d;
  }
}, { passive: true });

stage.addEventListener('touchend', () => { isDragging = false; });

/* ============================================================
 *  节点选中 / 高亮路径
 * ============================================================ */
let selectedId = null;

function getAncestorChain(id) {
  const chain = [];
  let cur = nodeMap.get(id);
  while (cur) {
    chain.unshift(cur.id);
    cur = cur.parent ? nodeMap.get(cur.parent) : null;
  }
  return chain;
}

function highlightPath(id) {
  const chain = new Set(getAncestorChain(id));
  document.querySelectorAll('.node-group').forEach(g => {
    const nid = g.getAttribute('data-id');
    if (chain.has(nid)) {
      g.querySelector('.node-bg').style.filter = 'url(#glow)';
    }
  });
  document.querySelectorAll('.edge').forEach(e => {
    if (chain.has(e.getAttribute('data-from')) && chain.has(e.getAttribute('data-to'))) {
      e.style.stroke = 'rgba(246, 211, 101, 0.8)';
      e.style.strokeWidth = '2.5';
    }
  });
}

function clearHighlight() {
  document.querySelectorAll('.node-bg').forEach(r => r.style.filter = '');
  document.querySelectorAll('.edge').forEach(e => {
    e.style.stroke = '';
    e.style.strokeWidth = '';
  });
}

function selectNode(id) {
  selectedId = id;
  const node = nodeMap.get(id);
  if (!node) return;

  // 缩放到可读比例并居中（有配偶时居中到夫妻中点）
  const spouse = getSpouse(node);
  const centerX = spouse ? (node.x + spouse.x) / 2 : node.x;
  const targetScale = Math.max(viewState.scale, 1.0);
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const targetTx = cx - centerX * targetScale;
  const targetTy = cy - node.y * targetScale;
  animateView(targetScale, targetTx, targetTy, 500);

  showDetail(node);
}

/* 平滑动画过渡视图 */
let animFrame = null;
function animateView(targetScale, targetTx, targetTy, duration) {
  if (animFrame) cancelAnimationFrame(animFrame);
  const startScale = viewState.scale;
  const startTx = viewState.tx;
  const startTy = viewState.ty;
  const startTime = performance.now();
  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const e = 1 - Math.pow(1 - t, 3); // easeOutCubic
    viewState.scale = startScale + (targetScale - startScale) * e;
    viewState.tx = startTx + (targetTx - startTx) * e;
    viewState.ty = startTy + (targetTy - startTy) * e;
    applyTransform();
    if (t < 1) animFrame = requestAnimationFrame(step);
    else animFrame = null;
  }
  animFrame = requestAnimationFrame(step);
}

/* ============================================================
 *  详情面板
 * ============================================================ */
const detailPanel = document.getElementById('detailPanel');

function showDetail(node) {
  document.getElementById('dpAvatar').textContent = node.name.charAt(0);
  document.getElementById('dpName').textContent = node.name;
  document.getElementById('dpTitle').textContent = node.title || ('第 ' + node.generation + ' 世 · ' + typeName(node.type));
  document.getElementById('dpUuid').textContent = node.uuid;
  document.getElementById('dpGender').textContent = node.type === 'spouse' ? '配偶' : (node.gender === 'female' ? '女' : '男');
  document.getElementById('dpGen').textContent = '第 ' + node.generation + ' 世';
  document.getElementById('dpBranch').textContent = node.branch;
  const parent = node.parent ? nodeMap.get(node.parent) : null;
  document.getElementById('dpParent').textContent = parent ? parent.name : '— (始祖)';
  const spouse = node.children.find(c => c.type === 'spouse');
  document.getElementById('dpSpouse').textContent = spouse ? spouse.name : '—';
  const kids = node.children.filter(c => c.type !== 'spouse').map(c => c.name);
  document.getElementById('dpChildren').textContent = kids.length ? kids.join('、') : '—';
  detailPanel.classList.add('show');
}

function typeName(t) {
  return { ancestor: '先祖', male: '本族', spouse: '配偶', child: '子嗣' }[t] || '族人';
}

document.getElementById('closeDetail').onclick = () => detailPanel.classList.remove('show');
document.getElementById('copyUuid').onclick = () => {
  const uuid = document.getElementById('dpUuid').textContent;
  navigator.clipboard.writeText(uuid).then(() => toast('UUID 已复制到剪贴板'));
};

/* 颜色设置面板 */
const settingsPanel = document.getElementById('settingsPanel');
const defaultColors = {
  male: ['#5eead4', '#3b82f6'],
  female: ['#fb7185', '#f472b6'],
  ancestor: ['#f6d365', '#fda085'],
  spouse: ['#a78bfa', '#8b5cf6']
};

document.getElementById('settingsBtn').onclick = () => settingsPanel.classList.toggle('show');
document.getElementById('closeSettings').onclick = () => settingsPanel.classList.remove('show');

function setGenderColor(category, c1, c2) {
  document.documentElement.style.setProperty(`--${category}-color`, c1);
  document.documentElement.style.setProperty(`--${category}-color-2`, c2);
  if (typeof drawMinimap === 'function') drawMinimap();
}

document.getElementById('maleColor').addEventListener('input', e => setGenderColor('male', e.target.value, document.getElementById('maleColor2').value));
document.getElementById('maleColor2').addEventListener('input', e => setGenderColor('male', document.getElementById('maleColor').value, e.target.value));
document.getElementById('femaleColor').addEventListener('input', e => setGenderColor('female', e.target.value, document.getElementById('femaleColor2').value));
document.getElementById('femaleColor2').addEventListener('input', e => setGenderColor('female', document.getElementById('femaleColor').value, e.target.value));
document.getElementById('ancestorColor').addEventListener('input', e => setGenderColor('ancestor', e.target.value, document.getElementById('ancestorColor2').value));
document.getElementById('ancestorColor2').addEventListener('input', e => setGenderColor('ancestor', document.getElementById('ancestorColor').value, e.target.value));
document.getElementById('spouseColor').addEventListener('input', e => setGenderColor('spouse', e.target.value, document.getElementById('spouseColor2').value));
document.getElementById('spouseColor2').addEventListener('input', e => setGenderColor('spouse', document.getElementById('spouseColor').value, e.target.value));

document.getElementById('resetColors').onclick = () => {
  setGenderColor('male', defaultColors.male[0], defaultColors.male[1]);
  setGenderColor('female', defaultColors.female[0], defaultColors.female[1]);
  setGenderColor('ancestor', defaultColors.ancestor[0], defaultColors.ancestor[1]);
  setGenderColor('spouse', defaultColors.spouse[0], defaultColors.spouse[1]);
  document.getElementById('maleColor').value = defaultColors.male[0];
  document.getElementById('maleColor2').value = defaultColors.male[1];
  document.getElementById('femaleColor').value = defaultColors.female[0];
  document.getElementById('femaleColor2').value = defaultColors.female[1];
  document.getElementById('ancestorColor').value = defaultColors.ancestor[0];
  document.getElementById('ancestorColor2').value = defaultColors.ancestor[1];
  document.getElementById('spouseColor').value = defaultColors.spouse[0];
  document.getElementById('spouseColor2').value = defaultColors.spouse[1];
  toast('颜色已恢复默认');
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { detailPanel.classList.remove('show'); settingsPanel.classList.remove('show'); }
});

/* ============================================================
 *  搜索
 * ============================================================ */
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  if (!q) { searchResults.classList.remove('show'); return; }
  const matches = allNodes.filter(n => n.name.includes(q)).slice(0, 12);
  if (matches.length === 0) {
    searchResults.innerHTML = '<div class="item"><span style="color:var(--ink-dim)">未找到相关族人</span></div>';
  } else {
    searchResults.innerHTML = matches.map(n => {
      const tag = n.type === 'spouse' ? '配偶' : (n.gender === 'female' ? '女' : '男');
      return `<div class="item" data-id="${n.id}">
        <span class="dot" style="background:${getNodeColors(n).stroke}"></span>
        <span class="name">${n.name}</span>
        <span class="meta">第${n.generation}世 · ${tag}</span>
      </div>`;
    }).join('');
  }
  searchResults.classList.add('show');
});

searchResults.addEventListener('click', (e) => {
  const item = e.target.closest('.item[data-id]');
  if (!item) return;
  selectNode(item.getAttribute('data-id'));
  searchResults.classList.remove('show');
  searchInput.value = '';
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) searchResults.classList.remove('show');
});

/* ============================================================
 *  Toast
 * ============================================================ */
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

/* ============================================================
 *  初始化
 * ============================================================ */
function init() {
  createSvg();
  const root = buildTree(familyData);
  layout(root, 0, 0);
  updateBounds(root);
  renderEdges(root);
  renderNodes(root);
  renderGenLabels(root);
  initMinimap();

  // 统计
  const genMax = Math.max(...allNodes.map(n => n.generation));
  document.getElementById('stats').innerHTML =
    `族人 <b>${allNodes.length}</b> · 世代 <b>${genMax}</b> ·  UUID 已分配`;

  // 初始视图：聚焦始祖（可读比例），用户可通过搜索/小地图导航
  setTimeout(() => {
    focusOnRoot(root);
    drawMinimap();
    document.getElementById('loader').classList.add('hidden');
  }, 300);
}

window.addEventListener('load', init);
window.addEventListener('resize', () => { /* keep view */ });
</script>
